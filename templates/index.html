<html>
<head><title>Student Performance Prediction</title></head>
<body style="font-family: Arial; margin: 40px;">
    <h2>Student Performance Prediction</h2>
    <form method="POST">
        Hours Studied: <input type="number" step="any" name="hours" required><br><br>
        Previous Scores: <input type="number" step="any" name="previous" required><br><br>
        Extracurricular (1=Yes, 0=No): <input type="number" name="extra" required><br><br>
        Sleep Hours: <input type="number" step="any" name="sleep" required><br><br>
        Sample Papers: <input type="number" step="any" name="papers" required><br><br>
        <button type="submit">Predict</button>
    </form>
    {% if prediction is not none %}
        <h3>Predicted Performance Index: {{ prediction }}</h3>
    {% endif %}
</body>
</html>
